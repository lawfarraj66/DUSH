const CloudDB=(()=>{let snap=new Map,tm=0,seq=0,cur=null,busy=0,again=0,ch=null;

 for(;;){const{data,error}=await sb.from("records").select("t,rid,o,d").eq("org_id",ORG()).order("o",{ascending:true}).range(from,from+step-1);if(error)throw error;

async function flush(){const D=cur;if(!D)return;if(busy){again=1;return}busy=1;
 try{if(D.log.length>300)D.log.length=300;
  const up=[],mu=[],dl=[],seen=new Set,pend=[];
  for(const t in D){const v=D[t];if(!Array.isArray(v))continue;
   if(t==="log"||t==="tpl"){const j=JSON.stringify(v),k="m:"+t;seen.add(k);if(snap.get(k)?.j!==j){mu.push({org_id:ORG(),k:t,v});pend.push([k,{j}])}continue}
