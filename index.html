 SUPABASE_URL:"https://xoislbaudcilopdkdebg.supabase.co",        // مثال: https://abcdxyz.supabase.co
 SUPABASE_ANON_KEY:"sb_publishable_MQOo3PQQyzdo6SlqrnoEDQ_1aywrMn6",   // المفتاح العام (anon / publishable) من Project Settings → API

if(rs.length||ms.length){D={};rs.sort((a,b)=>a.o-b.o).forEach(r=>{(D[r.t]=D[r.t]||[]).push(r.d);snap.set(r.k,{j:r.j,o:r.o});seq=Math.max(seq,r.o)});ms.forEach(m=>{D[m.k]=m.v;snap.set("m:"+m.k,{j:JSON.stringify(m.v)})})}
else{try{D=JSON.parse(localStorage.getItem(LK)||"null")}catch(e){}}
navigator.storage?.persist?.();return D}catch(e){mode="ls";try{return JSON.parse(localStorage.getItem(LK)||"null")}catch(_){return null}}}
async function flush(){const D=cur;if(!D)return;if(mode==="ls"||!db){try{localStorage.setItem(LK,JSON.stringify(D))}catch(e){}return}
if(D.log.length>1000)D.log.length=1000;
try{const tx=db.transaction(["rec","meta"],"readwrite"),R=tx.objectStore("rec"),M=tx.objectStore("meta"),seen=new Set;
for(const t in D){const v=D[t];if(!Array.isArray(v))continue;
if(t==="log"||t==="tpl"){const j=JSON.stringify(v),k="m:"+t;seen.add(k);if(snap.get(k)?.j!==j){M.put({k:t,v});snap.set(k,{j})}continue}
v.forEach(r=>{const k=t+":"+r.id,j=JSON.stringify(r),s=snap.get(k);seen.add(k);if(!s||s.j!==j){const o=s?s.o:++seq;R.put({k,t,id:r.id,o,d:r,j});snap.set(k,{j,o})}})}
for(const k of [...snap.keys()])if(!seen.has(k)){snap.delete(k);if(!k.startsWith("m:"))R.delete(k)}}catch(e){console.error(e)}}
return{load,sync(D){cur=D;clearTimeout(tm);tm=setTimeout(flush,80)},
put:f=>rq(db.transaction("files","readwrite").objectStore("files").put(f)),files:ca=>rq(db.transaction("files").objectStore("files").index("ca").getAll(String(ca))),del:id=>rq(db.transaction("files","readwrite").objectStore("files").delete(id)),
async stat(){if(mode==="ls"||!db)return"التخزين: المتصفح (احتياطي)";const n=await rq(db.transaction("rec").objectStore("rec").count()),f=await rq(db.transaction("files").objectStore("files").count());return`قاعدة IndexedDB · ${n} سجل · ${f} مرفق`}}})();

/* ==================== التخزين السحابي (Supabase) ==================== */
const CloudDB=(()=>{let snap=new Map,tm=0,seq=0,cur=null,busy=0,again=0,ch=null;
const ORG=()=>CTX.org.id,UID=()=>CTX.user.id,toastE=m=>typeof toast==="function"?toast(m):console.warn(m);
async function load(){const D={};let from=0;const step=1000;snap=new Map;seq=0;
 for(;;){const{data,error}=await sb.from("records").select("t,rid,o,d").eq("org_id",ORG()).order("o",{ascending:true}).range(from,from+step-1);if(error)throw error;
  data.forEach(r=>{(D[r.t]=D[r.t]||[]).push(r.d);snap.set(r.t+":"+r.rid,{j:JSON.stringify(r.d),o:r.o});seq=Math.max(seq,Number(r.o))});if(data.length<step)break;from+=step}
 const{data:ms,error:e2}=await sb.from("meta").select("k,v").eq("org_id",ORG());if(e2)throw e2;

async function flush(){const D=cur;if(!D)return;if(busy){again=1;return}busy=1;
 try{if(D.log.length>300)D.log.length=300;
  const up=[],mu=[],dl=[],seen=new Set,pend=[];

   if(t==="log"||t==="tpl"){const j=JSON.stringify(v),k="m:"+t;seen.add(k);if(snap.get(k)?.j!==j){mu.push({org_id:ORG(),k:t,v});pend.push([k,{j}])}continue}
   v.forEach(r=>{const k=t+":"+r.id,j=JSON.stringify(r),s=snap.get(k);seen.add(k);if(!s||s.j!==j){const o=s?s.o:++seq;up.push({org_id:ORG(),t,rid:String(r.id),o,d:r,updated_by:UID()});pend.push([k,{j,o}])}})}
  for(const k of snap.keys())if(!seen.has(k)&&!k.startsWith("m:")){const i=k.indexOf(":");dl.push([k.slice(0,i),k.slice(i+1),k])}
