<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0e1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة مكتب المحاماة</title>
<style>
:root{--bg:#0b0f17;--card:#121826;--tx:#e6edf7;--mu:#8b97ad;--bd:#1f2a3d;--pr:#14b8a6;--sb:#0e1420;--er:#f43f5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f6fa;--card:#fff;--tx:#1c2433;--mu:#6b7488;--bd:#e2e6ee;--pr:#0d9488;--sb:#0f2b2e;--er:#c0392b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Tahoma,"Segoe UI",Arial,sans-serif}
#sb{position:fixed;top:0;bottom:0;right:0;width:230px;background:var(--sb);color:#cfd8ea;overflow-y:auto;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0px));z-index:5;transition:transform .3s}
#sb h2{margin:0 16px 10px;color:#fff;font-size:16px}
#sb small{display:block;padding:12px 16px 4px;color:#7f8db0;font-size:11px}
#sb a,#sb .lk{display:block;padding:9px 16px;margin:2px 10px;border-radius:10px;color:inherit;cursor:pointer}
#sb a:hover{background:#ffffff14}
#sb a.on{background:var(--pr);color:#fff}
#mn{margin-right:230px}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:18px;display:inline}
main{padding:16px;max-width:1150px}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--pr);color:#fff}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--er);padding:4px 8px}
#bm{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer}
.st b{display:block;font-size:22px;margin-top:4px;color:var(--pr)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:#fff;background:linear-gradient(90deg,#2563eb,#0d9488);font-weight:600}
tr:last-child td{border:0}
.b{padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--pr);color:var(--pr)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:18px}
dialog::backdrop{background:#0008}
label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.em{text-align:center;color:var(--mu);padding:28px}
h3{margin:16px 0 0}
.it{padding:5px 0;border-bottom:1px dashed var(--bd)}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sb);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
#prt{display:none}
button{transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.97)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:-1px}
.st{transition:transform .15s,border-color .15s}
.st:hover{transform:translateY(-2px);border-color:var(--pr)}
tbody tr:hover td{background:color-mix(in srgb,var(--pr) 8%,transparent)}
.bn{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bn button{background:#ffffff33;color:#fff;border:0}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
@media(max-width:760px){
  #sb{transform:translateX(100%)}
  #sb.o{transform:none}
  #mn{margin-right:0}
  #bm{display:inline-block}
  header{flex-wrap:wrap;padding:10px 12px}
  main{padding:10px}
  input,select,textarea{font-size:16px}
  button{min-height:40px}
  .row{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  .act{gap:6px}
}
@media print{body>*:not(#prt){display:none!important}#prt{display:block;font-size:14px;line-height:1.8;padding:24px}}
</style>
</head>
<body>
<nav id="sb"></nav>
<div id="mn">
  <header>
    <div>
      <button class="g" id="bm">☰</button>
      <button class="g" id="apb" title="التطبيقات">⊞</button>
      <h1 id="ttl"></h1>
    </div>
    <button class="g" id="th" title="المظهر">🌓</button>
    <button id="bell" title="التنبيهات">🔔</button>
  </header>
  <main id="ct"></main>
</div>
<dialog id="dg"><form id="fm" method="dialog"><h3 id="dt" style="margin:0"></h3><div id="ff"></div><div class="act"><button type="submit">حفظ</button><button type="button" class="g" id="cx">إلغاء</button></div></form></dialog>
<dialog id="dv"><div id="dc"></div><div class="act"><button id="dtp">📄 إنشاء مستند</button><button class="g" id="dx">✕</button></div></dialog>
<div id="ts"></div><div id="prt"></div>
<script>
/* ==================== إعدادات النشر ==================== */
const CFG={
  SUPABASE_URL:"https://ftmcvisewnemeljpembf.supabase.co",
  SUPABASE_ANON_KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0bWN2aXNld25lbWVsanBlbWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNTI4MjEsImV4cCI6MjEwNjkyODgyMX0.HY7vG_1vk_VfVvf-SNaKiuwOPzbtJ6uzVhUEcOjJGm8",
  MOYASAR_PK:""
};

window.CTX={mode:"local",role:"owner",org:null,user:null};
const CLOUD=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
let sb=null;

/* ==================== التخزين المحلي ==================== */
const LocalDB=(()=>{
  let db=null,cur=null,tm=0;
  const LK="lawfirm_v3";
  
  async function load(){
    try{
      const data=JSON.parse(localStorage.getItem(LK)||"null");
      return data;
    }catch(e){
      return null;
    }
  }
  
  async function flush(){
    if(!cur)return;
    try{
      localStorage.setItem(LK,JSON.stringify(cur));
    }catch(e){console.error(e)}
  }
  
  return{
    load,
    sync(D){cur=D;clearTimeout(tm);tm=setTimeout(flush,80)},
    bind(D){cur=D},
    refresh(D){return Promise.resolve()},
    put:f=>Promise.resolve(),
    files:c=>Promise.resolve([]),
    del:i=>Promise.resolve(),
    stat:()=>Promise.resolve("التخزين: المتصفح المحلي")
  };
})();

const CloudDB=(()=>{
  let cur=null,tm=0;
  const ORG=()=>CTX.org?.id,UID=()=>CTX.user?.id;
  
  async function load(){
    try{
      const{data,error}=await sb.from("records").select("*").eq("org_id",ORG()).limit(1);
      if(error)throw error;
      return {records:data||[]};
    }catch(e){console.error(e);return null}
  }
  
  async function flush(){
    if(!cur)return;
    clearTimeout(tm);
    tm=setTimeout(async()=>{
      try{
        if(!cur)return;
      }catch(e){console.error(e)}
    },120);
  }
  
  return{load,sync(D){cur=D;flush()},bind(D){cur=D},refresh(D){return Promise.resolve()},put:f=>Promise.resolve(),files:c=>Promise.resolve([]),del:i=>Promise.resolve(),stat:()=>Promise.resolve("التخزين: السحابة")};
})();

const DB={
  load:()=>CLOUD?CloudDB.load():LocalDB.load(),
  sync:D=>CLOUD?CloudDB.sync(D):LocalDB.sync(D),
  bind:D=>CLOUD&&CloudDB.bind(D),
  refresh:D=>CLOUD?CloudDB.refresh(D):Promise.resolve(),
  put:f=>CLOUD?CloudDB.put(f):LocalDB.put(f),
  files:c=>CLOUD?CloudDB.files(c):LocalDB.files(c),
  del:i=>CLOUD?CloudDB.del(i):LocalDB.del(i),
  stat:()=>CLOUD?CloudDB.stat():LocalDB.stat()
};

/* ==================== شاشة الدخول ==================== */
const AU=(()=>{
  const css=`#au{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:16px}
  #au .bx{width:min(420px,100%);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
  #au h2{margin:0 0 4px;color:var(--pr)}
  #au button.mx{width:100%;margin-top:12px;padding:11px}
  #au .er{color:var(--er);font-size:13px;margin-top:8px}`;
  
  const st=document.createElement("style");
  st.textContent=css;
  document.head.appendChild(st);
  
  function show(mode="in"){
    return new Promise(res=>{
      let d=document.getElementById("au");
      if(!d){d=document.createElement("div");d.id="au";document.body.appendChild(d)}
      
      d.innerHTML=`<div class="bx"><h2>⚖ نظام إدارة مكتب المحاماة</h2>
        <label>البريد الإلكتروني</label><input id="au_e" type="email" dir="ltr" placeholder="example@email.com">
        <label>كلمة المرور</label><input id="au_p" type="password" dir="ltr" placeholder="••••••••">
        <button class="mx" id="au_go">دخول</button>
        <div class="er" id="au_er"></div>
        </div>`;
      
      const go=document.getElementById("au_go");
      const err=document.getElementById("au_er");
      
      go.onclick=async()=>{
        go.disabled=true;
        const email=document.getElementById("au_e").value;
        const pw=document.getElementById("au_p").value;
        
        if(!CLOUD){
          CTX.mode="local";
          d.remove();
          res();
          return;
        }
        
        try{
          const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
          if(error)throw error;
          d.remove();
          res();
        }catch(e){
          err.textContent=e.message||"خطأ في الدخول";
          go.disabled=false;
        }
      };
    });
  }
  
  function msg(t){
    const d=document.createElement("div");
    d.id="au";
    d.innerHTML=`<div class="bx"><h2>⚠️</h2><p>${t}</p><button class="mx" id="aub">حسناً</button></div>`;
    document.body.appendChild(d);
  }
  
  return{show,msg};
})();

/* ==================== الإقلاع ==================== */
const loadScript=u=>new Promise((o,e)=>{const s=document.createElement("script");s.src=u;s.onload=o;s.onerror=()=>e(new Error(u));document.head.appendChild(s)});

async function enter(){
  if(!CLOUD)return true;
  try{
    const{data:{user}}=await sb.auth.getUser();
    CTX.user=user;
    CTX.mode="cloud";
    return true;
  }catch(e){
    return false;
  }
}

const $=id=>document.getElementById(id);

(async()=>{
  if(!CLOUD){
    const D=await DB.load();
    window.__DB=D||{};
    $("ct").innerHTML=`<div class="pn" style="text-align:center;padding:40px">
      <h2>✅ نظام إدارة مكتب المحاماة</h2>
      <p>تم التطبيق بنجاح!</p>
      <p style="color:var(--mu);font-size:13px">النمط: محلي (بدون سحابة)</p>
      <p style="color:var(--pr);font-size:13px;margin-top:10px">الإعدادات:</p>
      <div style="text-align:left;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px;font-family:monospace;font-size:12px">
        URL: ${CFG.SUPABASE_URL}<br>
        Key: متاح ✓
      </div>
    </div>`;
    return;
  }
  
  try{
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");
  }catch(e){
    AU.msg("تعذّر تحميل مكتبة Supabase");
    return;
  }
  
  sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  
  const{data:{session}}=await sb.auth.getSession();
  
  if(!session)await AU.show("in");
  if(!await enter())return;
  
  window.__DB=await DB.load();
  
  $("ct").innerHTML=`<div class="pn" style="text-align:center;padding:40px">
    <h2>✅ نظام إدارة مكتب المحاماة</h2>
    <p>تم الاتصال بـ Supabase بنجاح!</p>
    <p style="color:var(--mu);font-size:13px">المستخدم: ${CTX.user?.email||"مجهول"}</p>
    <p style="color:var(--pr);font-size:13px;margin-top:10px">الإعدادات:</p>
    <div style="text-align:left;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px;font-family:monospace;font-size:12px">
      URL: ${CFG.SUPABASE_URL}<br>
      Mode: Cloud ☁️ ✓
    </div>
  </div>`;
})();

$("th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light"};
$("bm").onclick=()=>$("sb").classList.toggle("o");
</script>
</body>
</html>
